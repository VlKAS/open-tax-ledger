name: Refresh reference data

on:
  schedule:
    # 09:07 Asia/Kolkata. Off-hour scheduling reduces GitHub Actions congestion.
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reference-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh SBI TT BUY and SEC snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh source snapshots
        id: refresh-data
        run: npm run data:refresh:ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate refreshed assets
        run: npm run check

      - name: Detect reference-data changes
        id: data-diff
        shell: bash
        run: |
          if git diff --quiet -- reference-data lib/reference-data.generated.js public/data/sbi-usd-tt-buy-community.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the review pull request
        if: steps.data-diff.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/reference-data-refresh
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SEC_STATUS: ${{ steps.refresh-data.outputs.sec-status }}
          SEC_LAST_MODIFIED: ${{ steps.refresh-data.outputs.sec-last-modified }}
          SEC_SHA256: ${{ steps.refresh-data.outputs.sec-sha256 }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "$UPDATE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$UPDATE_BRANCH"
          git add reference-data lib/reference-data.generated.js public/data/sbi-usd-tt-buy-community.csv
          git commit \
            -m "Keep tax reference evidence current for reviewer trust" \
            -m "Constraint: Source changes require review before production
          Confidence: high
          Scope-risk: moderate
          Directive: Keep reference refreshes PR-based and never auto-merge them
          Tested: npm run check
          SEC-status: $SEC_STATUS
          SEC-last-verified: $SEC_LAST_MODIFIED
          SEC-sha256: $SEC_SHA256"
          git push --force-with-lease origin "HEAD:refs/heads/$UPDATE_BRANCH"

          cat > "$RUNNER_TEMP/reference-data-pr.md" <<EOF
          This pull request was generated by the daily reference-data workflow.

          It refreshes:

          - the pinned community SBI USD TT BUY snapshot and row-level evidence links;
          - manifest hashes, counts, coverage, and generated browser assets.

          SEC company metadata status: **$SEC_STATUS**

          - Last official SEC verification: \`$SEC_LAST_MODIFIED\`
          - SEC snapshot SHA-256: \`$SEC_SHA256\`

          When the status is **stale**, the workflow attempted the official SEC endpoint
          but preserved the previous verified snapshot. It never uses a proxy or mirror.

          The workflow ran the complete validation suite before creating this pull request.
          Review source provenance and unexpected row-count or coverage changes before merging.

          This automation never merges its own pull request.
          EOF

          existing_pr="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --head "$UPDATE_BRANCH" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Refresh tax reference data snapshots" \
              --body-file "$RUNNER_TEMP/reference-data-pr.md"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "Refresh tax reference data snapshots" \
              --body-file "$RUNNER_TEMP/reference-data-pr.md"
          fi
